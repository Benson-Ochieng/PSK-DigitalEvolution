name: Deploy Main

on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build --if-present

  trigger-deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deployment Webhook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "Found RENDER_DEPLOY_HOOK. Triggering Render deployment..."
            curl -i -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          elif [ -n "${{ secrets.COOLIFY_WEBHOOK_URL }}" ]; then
            echo "Found COOLIFY_WEBHOOK_URL. Triggering Coolify deployment..."
            if [ -n "${{ secrets.COOLIFY_TOKEN }}" ]; then
              curl -i -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
                -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
            else
              curl -i -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}"
            fi
          else
            echo "::error::No deployment secret configured! Please set RENDER_DEPLOY_HOOK or COOLIFY_WEBHOOK_URL in GitHub repository settings."
            exit 1
          fi


